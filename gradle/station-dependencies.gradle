repositories {
    ivy {
        url 'https://raw.githubusercontent.com/Seo-4d696b75/station_database'
        patternLayout {
            // [revision] maps to the tag (e.g., v20251221)
            // URL structure: https://raw.githubusercontent.com/.../refs/tags/v20251221/out/main/station.csv
            artifact 'refs/tags/[revision]/out/main/[artifact].[ext]'
            // Fallback for files at root (like latest_info.json)
            artifact 'refs/tags/[revision]/[artifact].[ext]'
        }
        metadataSources {
            artifact()
        }
    }
}

configurations {
    stationData
}

task downloadStationData(type: Copy) {
    from configurations.stationData
    into 'src/main/assets'
    // station.json は APK に含めず、buildVoronoiGeoJson タスクで voronoi.geojson に変換する
    exclude '**/station*.json'
    rename { String fileName ->
        if (fileName.contains("station") && fileName.endsWith(".csv")) return "station.csv"
        if (fileName.contains("line")) return "line.csv"
        if (fileName.contains("register")) return "register.csv"
        if (fileName.contains("latest_info")) return "latest_info.json"
        return fileName
    }
}

def voronoiGeoJsonFile = file('src/main/assets/voronoi.geojson')

task buildVoronoiGeoJson {
    description 'station.json から駅のボロノイ範囲だけを抜き出して voronoi.geojson を作る'
    inputs.files { configurations.stationData }
    outputs.file voronoiGeoJsonFile

    doLast {
        def srcFile = configurations.stationData.find { it.name.startsWith('station') && it.name.endsWith('.json') }
        if (srcFile == null) {
            throw new GradleException('station.json が取得できていません。app/build.gradle の stationData 定義を確認してください。')
        }

        def stations = new groovy.json.JsonSlurper().parse(srcFile)

        // station.json の voronoi はそのまま GeoJSON の Feature なので、properties を埋めるだけでよい。
        // 分割範囲の端にある駅は LineString なので、始点と終点を結んで閉じる（全て Polygon になる）
        def features = stations.collect { station ->
            def geometry = station.voronoi.geometry
            def ring = (geometry.type == 'Polygon')
                    ? geometry.coordinates[0]
                    : geometry.coordinates + [geometry.coordinates[0]]

            [type: 'Feature',
             properties: [c: station.code, a: station.attr ?: 'unknown'],
             geometry: [type: 'Polygon', coordinates: [ring]]]
        }

        voronoiGeoJsonFile.text = groovy.json.JsonOutput.toJson([type: 'FeatureCollection', features: features])
        logger.lifecycle("voronoi.geojson: ${features.size()} features, ${voronoiGeoJsonFile.length()} bytes")
    }
}

// Hook into preBuild to ensure assets are downloaded before build starts
preBuild.dependsOn downloadStationData, buildVoronoiGeoJson
